spring:
  application:
    name: foodie-api
  datasource:
    url: jdbc:postgresql://localhost:5432/foodie_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  web:
    error:
      include-stacktrace: never

app:
  jwt:
    access-expiration: 900000
    refresh-expiration: 604800000
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-bytes}

server:
  port: 8080
